[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nura"
version = "0.1.0"
description = "Nura (PIHD) — Protocolo de Inteligencia Artificial Hibrida Direcionado"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sqlmodel>=0.0.14",
    "pydantic>=2.0.0",
    "chromadb>=0.4.0,<0.6.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "langgraph>=0.0.20",
    "langgraph-checkpoint>=0.0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
]
